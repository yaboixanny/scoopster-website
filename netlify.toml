[build]
  command = "node generate-sitemap.js"
  publish = "."

# Disable Netlify's automatic sitemap generation
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/service-areas/newmarket"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/service-areas/newmarket/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/service-areas/newmarket/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/best-dog-parks-in-ancaster"
  to = "/blog/best-dog-parks-hamilton/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/best-dog-parks-in-ancaster/"
  to = "/blog/best-dog-parks-hamilton/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/best-dog-parks-in-ancaster/index.html"
  to = "/blog/best-dog-parks-hamilton/"
  status = 301
  force = true
